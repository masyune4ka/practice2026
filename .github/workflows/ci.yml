name: Global CI/CD for All Tasks

on:
  push:
    branches:
      - '**'      
  pull_request:
    branches:
      - main     

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0' 

    - name: Restore dependencies
      run: dotnet restore practice2026/practice2026.sln

    - name: Build all projects
      run: dotnet build practice2026/practice2026.sln --no-restore --configuration Release

    - name: Run all tests
      run: dotnet test practice2026/practice2026.sln --no-build --configuration Release --verbosity normal
